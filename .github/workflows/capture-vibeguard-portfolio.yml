name: Capture VibeGuard Portfolio Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-vibeguard-portfolio.yml"
      - "scripts/capture-vibeguard-portfolio.mjs"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture portfolio images
        run: node scripts/capture-vibeguard-portfolio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vibeguard-wishket-images
          path: artifacts/vibeguard-wishket/
          if-no-files-found: error
          retention-days: 14
