name: Receive Portfolio Demo

on:
  workflow_call:
    inputs:
      slug:
        description: Public demo slug
        required: true
        type: string
      artifact_name:
        description: Uploaded portfolio artifact name
        required: false
        default: portfolio-demo
        type: string
    secrets:
      PORTFOLIO_HUB_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download sanitized demo artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: incoming-demo

      - name: Checkout public portfolio hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gycha0109-beep/portfolio_hub
          ref: main
          path: hub
          token: ${{ secrets.PORTFOLIO_HUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Validate public demo boundary
        run: node hub/scripts/validate-demo-package.mjs incoming-demo "${{ inputs.slug }}"

      - name: Publish public-only demo atomically
        shell: bash
        working-directory: hub
        run: |
          set -euo pipefail

          git config user.name "portfolio-publisher[bot]"
          git config user.email "portfolio-publisher[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"

            git fetch origin main
            git reset --hard origin/main

            target="public/demos/${{ inputs.slug }}"
            rm -rf "$target"
            mkdir -p "$target"
            cp -a ../incoming-demo/. "$target/"

            node scripts/upsert-project-manifest.mjs               portfolio.manifest.json               ../incoming-demo/portfolio.json

            git add portfolio.manifest.json "$target"

            if git diff --cached --quiet; then
              echo "No public demo changes to publish."
              exit 0
            fi

            git commit -m "portfolio: publish ${{ inputs.slug }}"

            if git push origin HEAD:main; then
              echo "Published ${{ inputs.slug }} successfully."
              exit 0
            fi

            echo "Main changed during publish; retrying from latest origin/main."
            sleep $((attempt * 2))
          done

          echo "Failed to publish after 5 attempts."
          exit 1
