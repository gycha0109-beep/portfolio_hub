name: Install Portfolio Covers

on:
  push:
    paths:
      - '.cover-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify uploaded covers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/covers

          cat .cover-upload/partnerops.*.b64 | tr -d '\n\r' | base64 -d > public/covers/partnerops.webp
          cat .cover-upload/lms.*.b64 | tr -d '\n\r' | base64 -d > public/covers/lms.webp

          test "$(wc -c < public/covers/partnerops.webp)" -eq 12116
          test "$(wc -c < public/covers/lms.webp)" -eq 14824

          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "public/covers/partnerops.webp": "af47b88a51217adf26ccd6716d0b8c97b339cc335b370699a6c7d6832c455aa4",
              "public/covers/lms.webp": "e60cea20024f42d9bd5019a3df40e8e0900d2a1a46ca87afaf1a38d6a801c452",
          }

          for path, wanted in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha256(data).hexdigest()
              if got != wanted:
                  raise SystemExit(f"{path}: sha256 mismatch {got} != {wanted}")
              if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  raise SystemExit(f"{path}: not a WebP file")
              print(path, len(data), got, "WEBP OK")
          PY

      - name: Commit verified binary covers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "portfolio-assets[bot]"
          git config user.email "portfolio-assets[bot]@users.noreply.github.com"
          git add public/covers/partnerops.webp public/covers/lms.webp

          if git diff --cached --quiet; then
            echo "Verified covers are already installed."
            exit 0
          fi

          git commit -m "fix: install verified portfolio cover binaries"
          git pull --rebase origin main
          git push origin HEAD:main
