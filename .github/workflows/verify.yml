name: Verify Porthub

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "porthub-verify-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test public demo security gate
        run: node scripts/test-demo-security-gate.mjs
      - name: Verify published demo registry
        run: node scripts/verify-all-public-demos.mjs
      - name: Check CareLedger demo scripts
        run: |
          node --check public/demos/careledger/app.js
          node --check scripts/capture-careledger-site-demo.mjs
      - name: Typecheck and build
        run: npm run build
