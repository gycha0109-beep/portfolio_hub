name: Import CareLedger Demo Video

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-careledger-demo.yml"

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import verified CareLedger video
        run: |
          rm -rf /tmp/careledger-video
          mkdir -p /tmp/careledger-video public/demos/careledger
          curl -fL --retry 2 --connect-timeout 15 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-ff6c-820b-a99c-acb533a6d0e3/raw?se=2026-09-25T04%3A22%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=6cab4c12-d1e9-5486-a841-017864ffa593&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T04%3A07%3A40Z&ske=2026-09-26T04%3A07%3A40Z&sks=b&skv=2026-02-06&sig=0BoZ8AJXw/A13YomH1nb/8UpLK4p182OGcI%2BOKBE6W4%3D' -o /tmp/careledger-video.zip
          unzip -o /tmp/careledger-video.zip -d /tmp/careledger-video
          test "$(stat -c%s /tmp/careledger-video/careledger-demo.mp4)" -eq 4689637
          test -s /tmp/careledger-video/careledger-demo-poster.webp
          cp /tmp/careledger-video/careledger-demo.mp4 public/demos/careledger/careledger-demo.mp4
          cp /tmp/careledger-video/careledger-demo-poster.webp public/demos/careledger/careledger-demo-poster.webp

      - name: Commit video assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/demos/careledger/careledger-demo.mp4 public/demos/careledger/careledger-demo-poster.webp
          git commit -m "feat: publish CareLedger demo video [skip ci]"
          git push origin HEAD:main
